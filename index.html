<style>

<script>
const SUPABASE_URL="https://rixbpgjuokevcuriefgp.supabase.co", SUPABASE_KEY="sb_publishable_x4LK1CYr7f2w5PvhSjvtvg_wmp7r1zq";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const ymd=d=>d.toLocaleDateString("sv");
let nivelAct=1,user,tags=[],cache={},audioBlob=null,rec=null,grabando=false,t0=0,editId=null,editAudio=null,fecha=ymd(new Date()),mes=new Date();
mes.setDate(1);
const msg=(t,ok)=>{$("msg").style.color=ok?"#15803d":"";$("msg").textContent=t||"";if(t)setTimeout(()=>$("msg").textContent="",6000)};
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const colorDe=n=>(tags.find(t=>t.nombre===n)||{}).color||"#8aa0b8";
const loc=iso=>{const d=new Date(iso);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
function colEtq(){const s=$("etq"),c=colorDe(s.value);s.style.background=c;s.style.color="#fff";s.style.borderColor=c;s.style.fontWeight="700"}
function tab(t){document.querySelectorAll("#tabs [data-t]").forEach(x=>x.classList.toggle("on",x.dataset.t===t));["dia","busca","etiq","ajus"].forEach(x=>$("t-"+x).classList.toggle("oculto",x!==t))}

async function entrar(nuevo){
 const c={email:$("em").value.trim(),password:$("pw").value};
 if(!c.email||!c.password)return msg("Rellena los campos correo y contraseña.");
 const {error}=nuevo?await db.auth.signUp(c):await db.auth.signInWithPassword(c);
 if(error)return msg(error.message);
 if(nuevo)msg("Cuenta creada. Si te piden confirmar el correo, hazlo y entra.");
 await iniciar(true);
}
async function iniciar(registrar){
 const {data}=await db.auth.getSession();if(!data.session)return;
 user=data.session.user;$("login").classList.add("oculto");$("app").classList.remove("oculto");
 await db.from("registro_acceso").insert({user_id:user.id,evento:registrar?"login":"sesion",agente:navigator.userAgent});
 const {data:p}=await db.from("perfiles").select("telegram_chat_id").eq("id",user.id).maybeSingle();$("chat").value=p?.telegram_chat_id||"";
 await cargarTags();
 if(!tags.length){await db.from("etiquetas").insert([["Médico","#16a34a"],["Cumpleaños","#db2777"],["Recordatorio","#d97706"],["Apuntes","#2563eb"]].map(([nombre,color])=>({user_id:user.id,nombre,color})));await cargarTags()}
 dia();
}
async function cargarTags(){
 const {data}=await db.from("etiquetas").select("*").order("nombre");tags=data||[];
 const op=tags.map(t=>`<option>${esc(t.nombre)}</option>`).join("");
 const sel=$("etq").value;$("etq").innerHTML=tags.map(t=>`<option style="background:${t.color||"#2563eb"};color:#fff">${esc(t.nombre)}</option>`).join("");if(sel)$("etq").value=sel;colEtq();
 $("qEtq").innerHTML='<option value="">Todas las etiquetas</option>'+op;
 $("listaEtq").innerHTML=tags.map(t=>{const c=t.color||"#2563eb";return `<div class="nota n1 etq" style="border-color:${c}"><span><i class="pt" style="background:${c}"></i><b>${esc(t.nombre)}</b></span><input type="color" value="${c}" data-col="${t.id}" aria-label="Color de ${esc(t.nombre)}"><button data-del="${t.id}" aria-label="Eliminar ${esc(t.nombre)}">🗑</button></div>`}).join("");
}
async function calendario(){
 const y=mes.getFullYear(),m=mes.getMonth(),ult=new Date(y,m+1,0).getDate();
 const {data}=await db.from("notas").select("fecha,etiqueta").gte("fecha",ymd(new Date(y,m,1))).lte("fecha",ymd(new Date(y,m,ult)));
 const mp={};(data||[]).forEach(n=>{(mp[n.fecha]=mp[n.fecha]||new Set()).add(n.etiqueta)});
 let h=["L","M","X","J","V","S","D"].map(d=>`<span>${d}</span>`).join("")+"<div></div>".repeat((new Date(y,m,1).getDay()+6)%7);
 const hoy=ymd(new Date());
 for(let d=1;d<=ult;d++){const f=ymd(new Date(y,m,d));
  const pts=[...(mp[f]||[])].slice(0,4).map(e=>`<i style="background:${colorDe(e)}"></i>`).join("");
  h+=`<button class="dc${f===fecha?" sel":""}${f===hoy?" hoy":""}" data-dia="${f}">${d}<span class="dots">${pts}</span></button>`}
 $("mesTit").textContent=mes.toLocaleDateString("es-ES",{month:"long",year:"numeric"});$("rej").innerHTML=h;
}
const alTxt=n=>n.dias_antes?new Date(n.alarma_hasta).toLocaleTimeString("es-ES",{timeStyle:"short"})+", cada día desde "+n.dias_antes+" días antes":new Date(n.alarma_en).toLocaleString("es-ES",{dateStyle:"short",timeStyle:"short"})+(n.repetir?" ("+n.repetir+")":"");
function tarjeta(n){
 const lv=["","Apunte","Recordatorio","Importante"][n.nivel];
 const c=colorDe(n.etiqueta);
 return `<div class="nota" style="border-color:${c};background:color-mix(in srgb,${c} 22%,#fff)"><div><div class="meta">${n.fecha}${n.hora?" · "+n.hora.slice(0,5):""} · <i class="pt" style="background:${colorDe(n.etiqueta)}"></i>${esc(n.etiqueta)}${n.alarma_en?" · ⏰ "+alTxt(n):""}</div>
 <div>${esc(n.texto).replace(/\n/g,"<br>")}</div>${n.audio_path?`<audio controls data-p="${n.audio_path}"></audio>`:""}</div>
 <div class="acc"><button data-edita="${n.id}" aria-label="Editar">✏️</button><button data-borra="${n.id}" data-a="${n.audio_path||""}" aria-label="Borrar">🗑</button></div></div>`;
}
async function pintar(el,lista){
 lista.forEach(n=>cache[n.id]=n);
 el.innerHTML=lista.length?lista.map(tarjeta).join(""):"<p>No hay apuntes.</p>";
 for(const a of el.querySelectorAll("audio[data-p]")){const {data}=await db.storage.from("audios").createSignedUrl(a.dataset.p,3600);if(data)a.src=data.signedUrl}
}
async function dia(){
 if(!editId)$("fnota").value=fecha;
 $("tit").textContent=new Date(fecha+"T12:00").toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
 calendario();
 const {data,error}=await db.from("notas").select("*").eq("fecha",fecha).order("nivel",{ascending:false}).order("hora");
 if(error)return msg(error.message);pintar($("lista"),data);
}
function limpiar(){
 ["texto","hora","alarma","rep","alHora"].forEach(i=>$(i).value="");$("antes").value=7;modoRep();nivelAct=1;audioBlob=null;editId=null;editAudio=null;
 $("estAudio").textContent="";$("bGuardar").textContent="Guardar apunte";$("bCancel").classList.add("oculto");
}
function editar(id){
 const n=cache[id];if(!n)return;
 editId=id;editAudio=n.audio_path;audioBlob=null;fecha=n.fecha;mes=new Date(n.fecha+"T12:00");mes.setDate(1);
 $("texto").value=n.texto==="(audio)"?"":n.texto;nivelAct=n.nivel||1;if(n.etiqueta)$("etq").value=n.etiqueta;colEtq();
 $("fnota").value=n.fecha;$("hora").value=n.hora?n.hora.slice(0,5):"";$("alarma").value=n.alarma_en&&!n.dias_antes?loc(n.alarma_en):"";$("rep").value=n.dias_antes?"antes":(n.repetir||"");$("antes").value=n.dias_antes||7;$("alHora").value=n.dias_antes&&n.alarma_hasta?loc(n.alarma_hasta).slice(11,16):"";modoRep();
 $("estAudio").textContent=n.audio_path?"Este apunte tiene audio. Graba otro para cambiarlo.":"";
 $("bGuardar").textContent="Guardar cambios";$("bCancel").classList.remove("oculto");
 tab("dia");dia();$("texto").scrollIntoView({behavior:"smooth",block:"center"});$("texto").focus();
}
async function guardar(){
 const texto=$("texto").value.trim();if(!texto&&!audioBlob&&!editAudio)return msg("Escribe algo o graba un audio.");
 const f=$("fnota").value||fecha,modo=$("rep").value;let al=null,hasta=null,antes=null,repe=modo||null;
 if(modo==="antes"){
  const h=$("alHora").value,n=Math.max(1,+$("antes").value||1);if(!h)return msg("Elige la hora del aviso.");
  hasta=new Date(f+"T"+h+":00");const d=new Date(hasta);d.setDate(d.getDate()-n);
  while(d<new Date())d.setDate(d.getDate()+1);
  if(d>hasta)return msg("Esa alarma ya ha pasado. Elige menos días antes u otro día.");
  al=d.toISOString();hasta=hasta.toISOString();antes=n;repe="diaria";
 }else if($("alarma").value)al=new Date($("alarma").value).toISOString();
 let ap=editAudio;
 if(audioBlob){ap=`${user.id}/${Date.now()}.webm`;const {error}=await db.storage.from("audios").upload(ap,audioBlob);if(error)return msg(error.message);if(editAudio)await db.storage.from("audios").remove([editAudio])}
 const row={fecha:f,hora:$("hora").value||null,texto:texto||"(audio)",nivel:nivelAct,etiqueta:$("etq").value,alarma_en:al,repetir:repe,alarma_hasta:hasta,dias_antes:antes,audio_path:ap,avisada:false};
 const {error}=editId?await db.from("notas").update(row).eq("id",editId):await db.from("notas").insert({...row,user_id:user.id});
 if(error)return msg(error.message);
 limpiar();fecha=f;mes=new Date(f+"T12:00");mes.setDate(1);dia();
}
let dic=null,dictando=false;
const TXT_DIC="🗣 Mantén pulsado para dictar";
function iniciarDic(e){
 e.preventDefault();const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR)return msg("Este navegador no dicta. Usa Chrome o Safari.");if(dic||dictando)return;dictando=true;
 try{e.target.setPointerCapture(e.pointerId)}catch{}
 const r=new SR();r.lang="es-ES";r.continuous=true;r.interimResults=false;dic=r;
 r.onresult=x=>{for(let i=x.resultIndex;i<x.results.length;i++)if(x.results[i].isFinal){const t=$("texto");t.value+=(t.value&&!/\s$/.test(t.value)?" ":"")+x.results[i][0].transcript.trim()}};
 r.onerror=x=>{if(x.error!=="no-speech"&&x.error!=="aborted")msg("No se pudo dictar: "+x.error)};
 r.onend=()=>{dic=null;dictando=false;$("bDictar").classList.remove("on");$("bDictar").textContent=TXT_DIC};
 $("bDictar").classList.add("on");$("bDictar").textContent="🔴 Escuchando… suelta para parar";

async function iniciarGrab(e){
 e.preventDefault();if(rec||grabando)return;grabando=true;
 try{e.target.setPointerCapture(e.pointerId)}catch{}
 try{
  const s=await navigator.mediaDevices.getUserMedia({audio:true});
  if(!grabando){s.getTracks().forEach(t=>t.stop());return}
  const ch=[];rec=new MediaRecorder(s);
  rec.ondataavailable=x=>ch.push(x.data);
  rec.onstop=()=>{s.getTracks().forEach(t=>t.stop());rec=null;$("bGrabar").classList.remove("on");$("bGrabar").textContent="🎙 Mantén pulsado para grabar";
   if(Date.now()-t0<700){audioBlob=null;$("estAudio").textContent="";return msg("Mantén pulsado el botón mientras hablas.")}
   audioBlob=new Blob(ch,{type:rec?.mimeType||"audio/webm"});$("estAudio").textContent="Audio listo. Pulsa Guardar."};
  t0=Date.now();rec.start();$("bGrabar").classList.add("on");$("bGrabar").textContent="🔴 Grabando… suelta para parar";
 }catch{grabando=false;msg("Sin permiso de micrófono. Permítelo y vuelve a mantener pulsado.")}
}
function pararGrab(){grabando=false;if(rec&&rec.state==="recording")rec.stop()}
async function buscar(){
 let q=db.from("notas").select("*");
 const t=$("q").value.trim(),e=$("qEtq").value,f=$("qFecha").value||fecha,d=$("qDir").value;
 if(t)q=q.ilike("texto","%"+t+"%");if(e)q=q.eq("etiqueta",e);
 if(d==="atras")q=q.lte("fecha",f).order("fecha",{ascending:false});
 else if(d==="adelante")q=q.gte("fecha",f).order("fecha",{ascending:true});
 else q=q.order("fecha",{ascending:false});
 const {data,error}=await q.limit(100);if(error)return msg(error.message);pintar($("res"),data);
}
